<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noms — Peek</title>
    <meta property="og:title" content="Add me on Noms Peek!">
    <meta property="og:description" content="Download Noms to connect and share your food diary with friends.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Rounded', system-ui, sans-serif;
            background: linear-gradient(180deg, #FAFAF8, #F2F1EE);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1A1A1A;
        }
        .card { text-align: center; padding: 48px 32px; max-width: 360px; }
        .emoji { font-size: 64px; margin-bottom: 16px; }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        p { font-size: 15px; color: #7A7A7A; margin-bottom: 24px; line-height: 1.5; }
        .btn {
            display: block; width: 100%; padding: 14px 0; text-align: center;
            border-radius: 16px; font-size: 16px; font-weight: 600;
            text-decoration: none; margin-bottom: 12px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #D4735E, #C4654D);
            color: white; box-shadow: 0 4px 16px rgba(212, 115, 94, 0.3);
        }
        .btn-secondary {
            background: #F4F3F1; color: #7A7A7A;
        }
        .sub { font-size: 12px; color: #ABABAB; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="emoji">🍜</div>
        <h1>Noms — Peek</h1>
        <p id="desc"></p>
        <a class="btn btn-primary" id="openBtn" href="#"></a>
        <a class="btn btn-secondary" id="storeBtn" href="https://apps.apple.com/app/id6759185418"></a>
        <p class="sub" id="sub"></p>
    </div>
    <script>
        var isVi = /^vi/i.test(navigator.language || '');
        var isPeek = /^\/peek\//i.test(window.location.pathname);

        if (isPeek) {
            var parts = window.location.pathname.split('/');
            var code = parts[2] || '';

            document.getElementById('desc').textContent = isVi
                ? 'Ai đó muốn thêm bạn trên Noms Peek!'
                : 'Someone wants to add you on Noms Peek!';
            document.getElementById('openBtn').textContent = isVi
                ? 'Mở trong Noms'
                : 'Open in Noms';
            document.getElementById('openBtn').href = 'noms://peek/' + code;
            document.getElementById('storeBtn').textContent = isVi
                ? 'Chưa có app? Tải Noms'
                : "Don't have the app? Get Noms";
            document.getElementById('sub').textContent = '';
        } else {
            document.getElementById('desc').textContent = isVi
                ? 'Trang không tồn tại.'
                : 'Page not found.';
            document.getElementById('openBtn').style.display = 'none';
            document.getElementById('storeBtn').textContent = isVi
                ? 'Về trang chủ'
                : 'Go to homepage';
            document.getElementById('storeBtn').href = 'https://noms.live';
            document.getElementById('sub').textContent = '';
        }
    </script>
</body>
</html>
