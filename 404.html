<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noms — Peek</title>
    <meta property="og:title" content="Add me on Noms Peek!">
    <meta property="og:description" content="Download Noms to connect and share your food diary with friends.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Rounded', system-ui, sans-serif;
            background: linear-gradient(180deg, #FAFAF8, #F2F1EE);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1A1A1A;
        }
        .card { text-align: center; padding: 48px 32px; max-width: 360px; }
        .emoji { font-size: 64px; margin-bottom: 16px; }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        p { font-size: 15px; color: #7A7A7A; margin-bottom: 24px; line-height: 1.5; }
        .btn {
            display: block; width: 100%; padding: 14px 0; text-align: center;
            border-radius: 16px; font-size: 16px; font-weight: 600;
            text-decoration: none; margin-bottom: 12px; cursor: pointer;
            border: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #D4735E, #C4654D);
            color: white; box-shadow: 0 4px 16px rgba(212, 115, 94, 0.3);
        }
        .btn-secondary {
            background: #F4F3F1; color: #7A7A7A;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="emoji">🍜</div>
        <h1>Noms — Peek</h1>
        <p id="desc"></p>
        <button class="btn btn-primary" id="openBtn" onclick="openApp()"></button>
        <a class="btn btn-secondary" href="https://apps.apple.com/app/id6759185418" id="storeBtn"></a>
    </div>
    <script>
        var isVi = /^vi/i.test(navigator.language || '');
        var isPeek = /^\/peek\//i.test(window.location.pathname);
        var parts = window.location.pathname.split('/');
        var code = parts[2] || '';

        if (isPeek && code) {
            var meta = document.createElement('meta');
            meta.name = 'apple-itunes-app';
            meta.content = 'app-id=6759185418, app-argument=noms://peek/' + code;
            document.head.appendChild(meta);

            document.getElementById('desc').textContent = isVi
                ? 'Ai đó muốn thêm bạn trên Noms Peek!'
                : 'Someone wants to add you on Noms Peek!';
            document.getElementById('openBtn').textContent = isVi
                ? 'Mở trong Noms'
                : 'Open in Noms';
            document.getElementById('storeBtn').textContent = isVi
                ? 'Tải Noms trên App Store'
                : 'Get Noms on App Store';
        } else {
            document.getElementById('desc').textContent = isVi
                ? 'Trang không tồn tại.' : 'Page not found.';
            document.getElementById('openBtn').style.display = 'none';
            document.getElementById('storeBtn').textContent = isVi
                ? 'Về trang chủ' : 'Go to homepage';
            document.getElementById('storeBtn').href = 'https://noms.live';
        }

        function openApp() {
            var appUrl = 'noms://peek/' + code;
            var storeUrl = 'https://apps.apple.com/app/id6759185418';

            // Try opening app
            window.location.href = appUrl;

            // Fallback: if app opened, window blurs → cancel redirect
            // If app not installed, error dialog shows → user dismisses → redirect fires
            var t = setTimeout(function() {
                window.location.href = storeUrl;
            }, 1500);

            window.addEventListener('pagehide', function() { clearTimeout(t); });
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) clearTimeout(t);
            });
        }
    </script>
</body>
</html>
