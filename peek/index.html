<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noms — Peek</title>
    <meta property="og:title" content="Add me on Noms Peek!">
    <meta property="og:description" content="Download Noms to connect and share your food diary with friends.">
    <meta property="og:type" content="website">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Rounded', system-ui, sans-serif;
            background: linear-gradient(180deg, #FAFAF8, #F2F1EE);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1A1A1A;
        }
        .card {
            text-align: center;
            padding: 48px 32px;
            max-width: 360px;
        }
        .emoji { font-size: 64px; margin-bottom: 16px; }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        p { font-size: 15px; color: #7A7A7A; margin-bottom: 32px; line-height: 1.5; }
        .btn {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #D4735E, #C4654D);
            color: white;
            text-decoration: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            box-shadow: 0 4px 16px rgba(212, 115, 94, 0.3);
        }
        .sub { font-size: 12px; color: #ABABAB; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="emoji">🍜</div>
        <h1>Noms — Peek</h1>
        <p id="desc"></p>
        <a class="btn" href="https://apps.apple.com/app/id6759185418" id="btn"></a>
        <p class="sub" id="sub"></p>
    </div>
    <script>
        var isVi = /^vi/i.test(navigator.language || '');
        document.getElementById('desc').textContent = isVi
            ? 'Tải Noms để thêm bạn bè và chia sẻ nhật ký ăn uống cùng nhau!'
            : 'Download Noms to add friends and share your food diary together!';
        document.getElementById('btn').textContent = isVi
            ? 'Tải Noms trên App Store'
            : 'Get Noms on App Store';
        document.getElementById('sub').textContent = isVi
            ? 'Đang chuyển hướng...'
            : 'Redirecting...';
        setTimeout(function() {
            window.location.href = 'https://apps.apple.com/app/id6759185418';
        }, 2000);
    </script>
</body>
</html>
